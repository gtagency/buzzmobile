machine:
  services:
    - docker

checkout:
  post:
      # Make sure that submodules are really, truly up to date
    - git submodule sync && - git submodule update --init || true && git submodule sync && git submodule update --init

dependencies:
  pre:
      # Move into ~/catkin_ws/src
    - mkdir -p ~/catkin_ws/src
    - mv ~/$CIRCLE_PROJECT_REPONAME ~/catkin_ws/src
      # Set build status to pending on start
    - cd ~/catkin_ws/src/$CIRCLE_PROJECT_REPONAME && sudo ./DoCIF/util/maketest.sh --pending
    - cd ~/catkin_ws/src/$CIRCLE_PROJECT_REPONAME && sudo ./DoCIF/commands/buildbaseimage.sh
      # Actually the test step
    - cd ~/catkin_ws/src/$CIRCLE_PROJECT_REPONAME && sudo ./DoCIF/commands/runtests.sh
  cache_directories:
      # This shouldn't actually cache anything because config.docif says not to
    - ~/.ccache # See $CACHE_DIRECTORIES in config.docif

# The test phase dosen't actually run tests. We need the caching from the deploy step.
test:
  override:
      # Display errors from testing step
    - cd ~/catkin_ws/src/$CIRCLE_PROJECT_REPONAME && ./DoCIF/commands/exit.sh

deployment:
  github:
    branch: master
    commands:
        # This will run DEPLOY_COMMAND as well
      - cd ~/catkin_ws/src/$CIRCLE_PROJECT_REPONAME && ./DoCIF/commands/deploy.sh
